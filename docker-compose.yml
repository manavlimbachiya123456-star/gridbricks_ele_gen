services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4173}
  frontend:
    build: ./frontend
    ports: ["4173:80"]
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on: [backend]

